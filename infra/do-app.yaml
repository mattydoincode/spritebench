# DigitalOcean App Platform spec: structure only.
#
#   doctl apps spec validate infra/do-app.yaml   # note: positional, not --spec
#   doctl apps create --spec infra/do-app.yaml   # once, to create the app
#   npm run spec:diff                            # what a push would submit
#   npm run spec:push                            # every change after creation
#
# No configuration values live here. Defaults are declared in `.env`, which
# ships inside the image; production secrets are set in the control panel. This
# file holds only what the platform itself has to know: components, the build,
# the health check, and the database binding.
#
# Use `npm run spec:push`, not `doctl apps update`. A submitted spec REPLACES
# the previous one, panel-set variables included, so applying this file
# directly would unset every credential -- the app would go on serving pages
# while no image could be read or written. `spec:push` reads the live spec
# first and carries those variables across.
#
# `production: true` attaches the existing spritebench-prod cluster rather than
# provisioning one, so db_name and db_user must already exist inside it -- see
# infra/DEPLOY.md. `version` has to match the live cluster, currently PG 18.
name: spritebench
region: nyc

databases:
  - name: db
    engine: PG
    version: "18"
    # A production database is an existing Managed Database cluster. Instance
    # size, standby nodes and scaling are set on the cluster itself -- the
    # spec's `size` and `num_nodes` fields are deprecated and ignored.
    production: true
    cluster_name: spritebench-prod
    db_name: spritebench
    db_user: spritebench

# The one variable that cannot come from a file or the panel: App Platform
# resolves the binding to the attached cluster's credentials at deploy time.
# BUILD_TIME as well as RUN_TIME because the Next build imports server modules.
envs:
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${db.DATABASE_URL}

# No `domains:` block, deliberately. spritebench.com is configured on
# Cloudflare, which proxies to the default ingress below and terminates TLS
# itself -- that is what buys the WAF, bot filtering and rate limiting.
#
# Adding the domain here as well would break it on a 90-day fuse: App Platform
# would keep re-validating a hostname that now resolves to Cloudflare, mark it
# `configuring`, and eventually fail certificate *renewal*. The two models are
# exclusive, not sequential.
#   https://docs.digitalocean.com/products/app-platform/how-to/configure-external-cdn/
#
# So the app answers only on *.ondigitalocean.app, and Cloudflare must not
# override the Host header on the way in.

services:
  - name: web
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    http_port: 8080
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: mattydoincode/spritebench
      branch: main
      deploy_on_push: true
    run_command: node_modules/.bin/next start -p 8080
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3

workers:
  - name: worker
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: mattydoincode/spritebench
      branch: main
      deploy_on_push: true
    # A worker component takes no http_port and gets no health check: it is
    # not routed, which is exactly what makes it a real always-on process.
    run_command: node dist/worker.mjs

jobs:
  # Runs after the build and before either component takes traffic; a non-zero
  # exit aborts the deploy. This is App Platform's release command. Exactly one
  # component may carry it -- two concurrent migrators race.
  - name: migrate
    kind: PRE_DEPLOY
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: mattydoincode/spritebench
      branch: main
    run_command: node dist/migrate.mjs
