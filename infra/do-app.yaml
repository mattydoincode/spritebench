# DigitalOcean App Platform spec.
#
#   doctl apps spec validate infra/do-app.yaml   # note: positional, not --spec
#   doctl apps create --spec infra/do-app.yaml   # once, to create the app
#   npm run spec:diff                            # what a push would submit
#   npm run spec:push                            # every change after creation
#
# Use `npm run spec:push`, not `doctl apps update`, for changes. A submitted
# spec REPLACES the previous one, and the four SECRET values below are empty
# here so this file can be committed -- so applying it directly would unset
# every credential in the control panel. The app would go on serving pages
# while no image could be read or written. `spec:push` reads the live spec
# first and carries its encrypted values across.
#
# `production: true` attaches the existing spritebench-prod cluster rather than
# provisioning one, so db_name and db_user must already exist inside it -- see
# infra/DEPLOY.md. `version` has to match the live cluster, currently PG 18.
name: spritebench
region: nyc

databases:
  - name: db
    engine: PG
    version: "18"
    # A production database is an existing Managed Database cluster. Instance
    # size, standby nodes and scaling are set on the cluster itself -- the
    # spec's `size` and `num_nodes` fields are deprecated and ignored.
    production: true
    cluster_name: spritebench-prod
    db_name: spritebench
    db_user: spritebench

# Only what production needs *differently* from the fallbacks in
# src/server/config.ts. FREE_ASSET_LIMIT, ASSET_RETENTION_DAYS,
# MAX_IMAGES_PER_REQUEST, WORKER_CONCURRENCY and QUEUE_DRAIN_TIMEOUT_MS already
# default to these values in code, so restating them here would only create two
# places to change one number.
#
# Applies to every component below, which is what keeps the worker and the
# migration job in step with the web service.
envs:
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${db.DATABASE_URL}

  # DigitalOcean's managed Postgres terminates TLS with a certificate that
  # does not chain to a public root, unlike a provider private network. Read
  # by the query pool and pg-boss together: if only one of the two can
  # connect, this is the setting to check.
  - key: DATABASE_SSL
    scope: RUN_TIME
    value: require

  - key: STORAGE_DRIVER
    scope: RUN_TIME
    value: r2
  - key: R2_BUCKET
    scope: RUN_TIME
    value: spritebench-prod
  - key: R2_ACCOUNT_ID
    scope: RUN_TIME
    type: SECRET
    value: ""
  - key: R2_ACCESS_KEY_ID
    scope: RUN_TIME
    type: SECRET
    value: ""
  - key: R2_SECRET_ACCESS_KEY
    scope: RUN_TIME
    type: SECRET
    value: ""

  # Encrypts stored provider keys at rest. The web service encrypts and the
  # worker decrypts, so it must be identical across components; rotating it
  # orphans every key users have saved.
  - key: ENCRYPTION_KEY
    scope: RUN_TIME
    type: SECRET
    value: ""


  # Kept deliberately low, because a redeploy is the peak: the previous web and
  # worker still hold their pools while the new migration job opens its own.
  # At 4 + 2 that is 6 per component, so 12 steady and 16 mid-deploy, against
  # roughly 22 usable connections on a 1 GiB single-node cluster. Confirm the
  # real ceiling with `select current_setting('max_connections')` before
  # raising either value or adding an instance.
  - key: DATABASE_POOL_MAX
    scope: RUN_TIME
    value: "4"
  - key: QUEUE_POOL_MAX
    scope: RUN_TIME
    value: "2"

services:
  - name: web
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    http_port: 8080
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: mattydoincode/spritebench
      branch: main
      deploy_on_push: true
    run_command: node_modules/.bin/next start -p 8080
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3

workers:
  - name: worker
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: mattydoincode/spritebench
      branch: main
      deploy_on_push: true
    # A worker component takes no http_port and gets no health check: it is
    # not routed, which is exactly what makes it a real always-on process.
    run_command: node dist/worker.mjs

jobs:
  # Runs after the build and before either component takes traffic; a non-zero
  # exit aborts the deploy. This is App Platform's release command. Exactly one
  # component may carry it -- two concurrent migrators race.
  - name: migrate
    kind: PRE_DEPLOY
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: mattydoincode/spritebench
      branch: main
    run_command: node dist/migrate.mjs
